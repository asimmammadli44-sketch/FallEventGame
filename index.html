<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADASchoolFallEvent - Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Animated Falling Leaves -->
    <div class="leaf-container">
      <div class="leaf">🍂</div>
      <div class="leaf">🍁</div>
      <div class="leaf">🍂</div>
      <div class="leaf">🍁</div>
      <div class="leaf">🍃</div>
      <div class="leaf">🍂</div>
      <div class="leaf">🍁</div>
      <div class="leaf">🍂</div>
    </div>

    <div class="main-wrapper">
      <!-- Game Section -->
      <div class="game-container" id="game-card">
        <div class="top-bar">
          <div class="event-badge">🍂 ADASchoolFallEvent 🍁</div>
        </div>

        <h1>Rock Paper Scissors</h1>

        <!-- Mode Selector -->
        <div class="mode-switch">
          <button id="mode-1p" class="mode-btn active" onclick="setMode('1P')">
            👤 1P vs Bot
          </button>
          <button id="mode-2p" class="mode-btn" onclick="setMode('2P')">
            📱 2P Mobile Pass
          </button>
        </div>

        <!-- Player Name Inputs -->
        <div class="player-setup" id="setup-1p">
          <input
            type="text"
            id="p1-name-solo"
            placeholder="Student name..."
            maxlength="15"
          />
          <button class="start-btn" onclick="startGame()">Start 20s</button>
        </div>

        <div class="player-setup hidden" id="setup-2p">
          <input
            type="text"
            id="p1-name-duo"
            placeholder="Player 1 Name"
            maxlength="10"
          />
          <span class="vs-text">VS</span>
          <input
            type="text"
            id="p2-name-duo"
            placeholder="Player 2 Name"
            maxlength="10"
          />
          <button class="start-btn" onclick="startGame()">Battle!</button>
        </div>

        <!-- Timer & Live Scores -->
        <div class="scoreboard">
          <div class="score">
            <span id="p1-board-label">Player 1</span>
            <span id="p1-score">0</span>
          </div>
          <div class="score timer-box">
            <span>⏳ Time</span>
            <span id="timer-display">20s</span>
          </div>
          <div class="score">
            <span id="p2-board-label">Bot</span>
            <span id="p2-score">0</span>
          </div>
        </div>

        <!-- Result Message Area -->
        <div id="result-message" class="message">
          Pick a mode, enter names, and start!
        </div>

        <!-- Universal Emoji Choice Buttons (Used for 1P and 2P Pass-and-Play) -->
        <div class="choices" id="emoji-controls">
          <button class="choice-btn" onclick="makeChoice('rock')">
            ✊<span class="btn-label">Rock</span>
          </button>
          <button class="choice-btn" onclick="makeChoice('paper')">
            ✋<span class="btn-label">Paper</span>
          </button>
          <button class="choice-btn" onclick="makeChoice('scissors')">
            ✌️<span class="btn-label">Scissors</span>
          </button>
        </div>

        <!-- Pass Phone Screen Overlay for 2P -->
        <div class="pass-screen hidden" id="pass-screen">
          <h3 id="pass-title">Pass phone to Player 2!</h3>
          <p>Make sure Player 1 isn't peeking 👀</p>
          <button class="start-btn" onclick="resume2P()">
            Ready! Tap Here
          </button>
        </div>
      </div>

      <!-- Ranked Leaderboard Section -->
      <div class="leaderboard-container">
        <h2>🏆 Event Leaderboard</h2>
        <p class="subtitle">Top scorer wins the fall gift!</p>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>
        <button id="clear-board-btn" onclick="clearLeaderboard()">
          Clear All Scores
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
